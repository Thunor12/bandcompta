[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
env = "1.0.1"
actix-rt = "2.10.0"
actix-web = "4.10.2"
chrono = { version = "0.4.41", features = ["serde"] }

diesel_migrations = "2.2.0"
diesel = { version = "2.2.10", features = ["sqlite", "chrono", "r2d2"] }
r2d2 = "0.8.10"
r2d2-diesel = "1.0.0"

dotenv = "0.15.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
rand = "0.9.1"
actix-cors = "0.7.1"
